name: Update Existing Activity
description: Request changes to the details of an existing extracurricular activity
title: "Update Activity: [Activity Name]"
labels: ["enhancement", "activities"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request changes to an existing activity. Only fill in the fields that need to be changed — leave others blank if no change is needed.

  - type: input
    id: activity-name
    attributes:
      label: Activity Name
      description: The exact name of the activity to be updated, as it currently appears in the system.
      placeholder: e.g., Chess Club
    validations:
      required: true

  - type: textarea
    id: new-description
    attributes:
      label: New Description (leave blank to keep current)
      description: The updated description of the activity, if it needs to change.
      placeholder: e.g., Learn advanced chess strategies and compete in local and regional tournaments.

  - type: checkboxes
    id: new-meeting-days
    attributes:
      label: New Meeting Days (leave all unchecked to keep current schedule)
      description: If the meeting days need to change, select the new days. If checked, this completely replaces the current schedule days.
      options:
        - label: Monday
        - label: Tuesday
        - label: Wednesday
        - label: Thursday
        - label: Friday
        - label: Saturday
        - label: Sunday

  - type: input
    id: new-start-time
    attributes:
      label: New Start Time (leave blank to keep current)
      description: The new start time in 24-hour format (HH:MM), if it needs to change.
      placeholder: e.g., 15:00

  - type: input
    id: new-end-time
    attributes:
      label: New End Time (leave blank to keep current)
      description: The new end time in 24-hour format (HH:MM), if it needs to change.
      placeholder: e.g., 17:00

  - type: input
    id: new-max-participants
    attributes:
      label: New Maximum Number of Participants (leave blank to keep current)
      description: The updated participant limit, if it needs to change.
      placeholder: e.g., 25

  - type: textarea
    id: reason
    attributes:
      label: Reason for Change
      description: Briefly explain why this update is needed.
      placeholder: e.g., The coach is available for an extra hour, so we are extending the session.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will you know the change has been correctly implemented?
      value: |
        - [ ] The activity page shows the updated information
        - [ ] All changed fields reflect the new values
        - [ ] No other activity details were accidentally changed
    validations:
      required: true
